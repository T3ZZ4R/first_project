<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body {
            display: flex;                       justify-content: center; 
            align-items: center;     
            flex-direction: column;  
            background: linear-gradient(121deg, rgba(255, 0, 0, 0.691), rgba(0, 0, 255, 0.684));
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
        .header {
            display: block;       
            color: black;
            font-size: 30px;
            text-align: center;     
            margin: 0 0 20px 0;    
        }
        
        button {
            width: 100px;
            height: 50px;
            border: 1px solid black;
            background: radial-gradient(circle, white, rgba(0, 0, 0, 0.382));
            cursor: pointer;                }
        
        button:hover {
            opacity: 0.8;           
        }
        
        a {
            all: unset;
            cursor: pointer;       
        }
        div {
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="header">hello world...</h1>
        <div>
            <button><a href="/README.md">click me...</a></button>
        </div>
    </header>
</body>
</html>
